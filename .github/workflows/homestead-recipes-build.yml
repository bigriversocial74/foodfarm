name: Homestead Recipes Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-recipes-build.yml

permissions:
  contents: write

jobs:
  build-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct recipe build
        shell: bash
        run: |
          set -euo pipefail
          cat .homestead-build/recipes-build.part-* > /tmp/recipes-build.b64
          base64 --decode /tmp/recipes-build.b64 > /tmp/recipes-build.tar.gz
          echo "db279fbde21b708af54e722b9329c72c15fc04c60615cce9304c426f83d7a52f  /tmp/recipes-build.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/recipes-build.tar.gz

      - name: Validate recipe and meal-planning build
        shell: bash
        run: |
          set -euo pipefail
          php -l phase4.php
          php -l app/bootstrap.php
          node --check assets/js/homestead-recipes.js

          if grep -RInE '(href|src)="/(assets|dashboard\.php|phase[0-9]+\.php|account\.php|logout\.php)' phase4.php app/bootstrap.php assets/css/homestead-recipes.css assets/js/homestead-recipes.js; then
            echo "Root-only route or asset path detected."
            exit 1
          fi

          if grep -nE '\b(ALTER|CREATE TABLE|DROP TABLE)\b' phase4.php; then
            echo "Unexpected schema SQL found in phase4.php."
            exit 1
          fi

          grep -q "'phase4.php' => \['class' => 'ui-recipes', 'stylesheet' => 'homestead-recipes.css'\]" app/bootstrap.php
          grep -q 'data-recipe-search' phase4.php
          grep -q 'data-recipe-filter' phase4.php
          grep -q 'Weekly Meal Planner' phase4.php
          grep -q 'name="action" value="create_recipe"' phase4.php
          grep -q 'name="action" value="add_ingredient"' phase4.php
          grep -q 'name="action" value="create_meal_plan"' phase4.php
          grep -q 'name="action" value="add_meal"' phase4.php
          grep -q 'name="action" value="complete_recipe"' phase4.php
          test -f assets/images/homestead/sheet-04/basil-grow-light-closeup.png
          test -f assets/images/homestead/sheet-05/dehydrated-food-jars.png
          test -f assets/images/homestead/sheet-05/fermentation-crock.png
          test -f assets/images/homestead/sheet-05/preservation-jars-wide.png
          echo "Recipe and meal-planning validation passed."

      - name: Commit recipe and meal-planning build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .homestead-build
          rm -f .github/workflows/homestead-recipes-source.yml
          rm -f .github/workflows/homestead-recipes-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4.php app/bootstrap.php assets/css/homestead-recipes.css assets/js/homestead-recipes.js
          git add -u .github/workflows .homestead-build
          git commit -m "Build Homestead recipe and meal-planning experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
