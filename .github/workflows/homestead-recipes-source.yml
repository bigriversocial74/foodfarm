name: Homestead Recipes Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-recipes-source.yml

permissions:
  contents: read

jobs:
  upload-recipes-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Upload recipe source
        uses: actions/upload-artifact@v4
        with:
          name: homestead-recipes-source
          path: |
            phase4.php
            app/bootstrap.php
            assets/css/app-shell.css
            assets/css/core-pages.css
            assets/css/workflow-polish.css
            assets/css/operations-polish.css
            assets/css/mobile-workflows.css
          if-no-files-found: error
          retention-days: 1
