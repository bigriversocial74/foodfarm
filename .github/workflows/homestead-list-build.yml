name: Homestead List Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-list-build.yml

permissions:
  contents: write

jobs:
  build-list:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct shopping build
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .homestead-build/list-build.part-00 \
            .homestead-build/list-build.part-01 \
            .homestead-build/list-build.part-02 \
            .homestead-build/list-build.part-03 \
            .homestead-build/list-build.part-04 \
            .homestead-build/list-build.part-05 \
            > /tmp/list-build.b64
          test "$(wc -c < /tmp/list-build.b64)" -eq 20648
          echo "9d4c259ababfadf730fd62410e3dc604d1e940d511fd7293634b0ce2f0304302  /tmp/list-build.b64" | sha256sum --check --strict
          base64 --decode /tmp/list-build.b64 > /tmp/list-build.tar.gz
          echo "1dc51c82170b45cef41e3ead0906375d5ea7d644e34062b9d9bf3efaa0314d5e  /tmp/list-build.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/list-build.tar.gz

      - name: Validate shopping build
        shell: bash
        run: |
          set -euo pipefail
          php -l shopping-list.php
          php -l app/bootstrap.php
          node --check assets/js/homestead-list.js

          if grep -RInE '(href|src)="/(assets|dashboard\.php|phase[0-9]+\.php|shopping-list\.php|account\.php|logout\.php)' shopping-list.php app/bootstrap.php assets/css/homestead-list.css assets/js/homestead-list.js; then
            echo "Root-only route or asset path detected."
            exit 1
          fi

          if grep -nE '\b(ALTER|CREATE TABLE|DROP TABLE)\b' shopping-list.php; then
            echo "Unexpected schema SQL found in shopping-list.php."
            exit 1
          fi

          grep -q "'shopping-list.php' => \['class' => 'ui-shopping', 'stylesheet' => 'homestead-list.css'\]" app/bootstrap.php
          grep -q "'shopping-list.php' => 'shopping'" app/bootstrap.php
          grep -q "'label' => 'Shopping List', 'href' => 'shopping-list.php'" app/bootstrap.php
          grep -q 'PlanningAutomationService' shopping-list.php
          grep -q 'acceptShoppingSuggestion' shopping-list.php
          grep -q 'dismissSuggestion' shopping-list.php
          grep -q 'name="action" value="accept_suggestion"' shopping-list.php
          grep -q 'name="action" value="dismiss_suggestion"' shopping-list.php
          grep -q 'data-shopping-tab' shopping-list.php
          grep -q 'data-shopping-search' shopping-list.php
          grep -q 'Shopping Summary' shopping-list.php
          grep -q 'Budget Overview' shopping-list.php
          grep -q 'Vendor Suggestions' shopping-list.php
          grep -q 'Smart Suggestions' shopping-list.php
          test -f assets/images/homestead/sheet-04/garden-monitoring-wide.png
          test -f assets/images/homestead/sheet-05/preservation-jars-wide.png
          echo "Shopping build validation passed."

      - name: Commit shopping list build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .homestead-build
          rm -f .github/workflows/homestead-list-source.yml
          rm -f .github/workflows/homestead-list-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shopping-list.php app/bootstrap.php assets/css/homestead-list.css assets/js/homestead-list.js
          git add -u .github/workflows .homestead-build
          git commit -m "Build Homestead shopping list experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
