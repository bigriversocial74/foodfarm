name: Homestead List Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-list-source.yml

permissions:
  contents: read

jobs:
  upload-list-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Discover shopping implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/homestead-list-source
          find . -type f \( -name '*.php' -o -name '*.sql' -o -name '*.css' -o -name '*.js' \) -not -path './.git/*' -print0 \
            | xargs -0 grep -IlE 'shopping_lists|shopping_list_items|shopping suggestion|Shopping List|estimated_price|acceptShoppingSuggestion' \
            | sort > /tmp/homestead-list-source/matched-files.txt || true
          cat /tmp/homestead-list-source/matched-files.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "/tmp/homestead-list-source/$(dirname "$file")"
            cp "$file" "/tmp/homestead-list-source/$file"
          done < /tmp/homestead-list-source/matched-files.txt
          cp app/bootstrap.php /tmp/homestead-list-source/app/bootstrap.php
          cp phase7.php /tmp/homestead-list-source/phase7.php
          cp app/PlanningAutomationService.php /tmp/homestead-list-source/app/PlanningAutomationService.php

      - name: Upload shopping source
        uses: actions/upload-artifact@v4
        with:
          name: homestead-list-source
          path: /tmp/homestead-list-source
          if-no-files-found: error
          retention-days: 1
