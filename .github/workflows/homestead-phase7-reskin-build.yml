name: Homestead Phase 7 Reskin Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/homestead-phase7-reskin-build.yml'
      - '.reskin/phase7/**'

permissions:
  contents: write

jobs:
  build-phase7:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct Phase 7 package
        shell: bash
        run: |
          set -euo pipefail
          cat .reskin/phase7/chunk-* > /tmp/phase7.b64
          test "$(wc -c < /tmp/phase7.b64)" = "21216"
          echo "491795ef3492f90873c738594d97cf8bc8c612ddbaa5f9808bde31fbeee93551  /tmp/phase7.b64" | sha256sum -c -
          base64 -d /tmp/phase7.b64 > /tmp/phase7.tar.gz
          echo "076657018aa86ed50d8be71ff9684ced0afd474ca5463c8dc7fa2a2f73abff6e  /tmp/phase7.tar.gz" | sha256sum -c -
          rm -rf /tmp/phase7-build
          mkdir -p /tmp/phase7-build
          tar -xzf /tmp/phase7.tar.gz -C /tmp/phase7-build

      - name: Validate Phase 7 rebuild
        shell: bash
        run: |
          set -euo pipefail
          php -l /tmp/phase7-build/phase7.php
          php -l /tmp/phase7-build/app/bootstrap.php
          node --check /tmp/phase7-build/assets/js/homestead-planning.js
          for action in run_cycle create_task create_template toggle_template start_task complete_task snooze_task cancel_task reopen_task accept_suggestion dismiss_suggestion; do
            grep -q "'$action'" /tmp/phase7-build/phase7.php
          done
          grep -q 'Plan the work' /tmp/phase7-build/phase7.php
          grep -q 'Household workload' /tmp/phase7-build/phase7.php
          grep -q 'Shopping suggestions' /tmp/phase7-build/phase7.php
          grep -q 'Recent planning cycles' /tmp/phase7-build/phase7.php
          grep -q "phase7.php'.*homestead-planning.css" /tmp/phase7-build/app/bootstrap.php
          ! grep -Eiq '\b(CREATE|ALTER|DROP)[[:space:]]+TABLE\b' /tmp/phase7-build/phase7.php
          ! grep -E 'href="/|src="/' /tmp/phase7-build/phase7.php

      - name: Commit Phase 7 rebuild
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase7-build/phase7.php phase7.php
          cp /tmp/phase7-build/app/bootstrap.php app/bootstrap.php
          cp /tmp/phase7-build/assets/css/homestead-planning.css assets/css/homestead-planning.css
          cp /tmp/phase7-build/assets/js/homestead-planning.js assets/js/homestead-planning.js
          rm -f .github/workflows/homestead-reskin-source.yml
          rm -f .github/workflows/homestead-phase7-reskin-build.yml
          rm -rf .reskin/phase7
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          ! echo "$changed" | grep -E '^(database/|app/(PlanningAutomationService|Auth|Database|.*Service)\.php)'
          git commit -m "Reskin Homestead planning and household automation"
          git push origin HEAD:${{ github.head_ref }}
