name: Phase 7 Source Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.phase7-sync/**'
      - '.github/workflows/phase7-package-sync.yml'

permissions:
  actions: read
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Download recovered Phase 7 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/8621588480/zip > /tmp/phase7-artifact.zip
          mkdir -p /tmp/phase7-artifact /tmp/phase7-source
          unzip -q /tmp/phase7-artifact.zip -d /tmp/phase7-artifact
          tar -xzf /tmp/phase7-artifact/phase7-recovered-source.tar.gz -C /tmp/phase7-source

      - name: Validate recovered source
        run: |
          set -euo pipefail
          files=(
            phase7.php
            app/PlanningAutomationService.php
            api/phase7-health.php
            docs/PHASE7_PLANNING_TASKS_AUTOMATION.md
            PHASE7_HANDOFF.md
            tests/phase7_http_smoke.sh
            tests/phase7_static_audit.php
          )
          for file in "${files[@]}"; do
            test -s "/tmp/phase7-source/${file}"
          done
          php -l /tmp/phase7-source/phase7.php
          php -l /tmp/phase7-source/app/PlanningAutomationService.php
          php -l /tmp/phase7-source/api/phase7-health.php
          php -l /tmp/phase7-source/tests/phase7_static_audit.php
          bash -n /tmp/phase7-source/tests/phase7_http_smoke.sh

      - name: Upsert recovered source on Phase 7 branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          branch = os.environ['HEAD_BRANCH']
          token = os.environ['GH_TOKEN']
          root = Path('/tmp/phase7-source')
          files = [
              'phase7.php',
              'app/PlanningAutomationService.php',
              'api/phase7-health.php',
              'docs/PHASE7_PLANNING_TASKS_AUTOMATION.md',
              'PHASE7_HANDOFF.md',
              'tests/phase7_http_smoke.sh',
              'tests/phase7_static_audit.php',
          ]

          def request(method: str, path: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.github.com/' + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'homestead-phase7-recovery',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  if error.code == 404:
                      return None
                  raise RuntimeError(f'GitHub API {error.code}: {body}') from error

          for path in files:
              quoted = urllib.parse.quote(path, safe='/')
              existing = request('GET', f'repos/{repository}/contents/{quoted}?ref={urllib.parse.quote(branch)}')
              payload = {
                  'message': 'Recover Phase 7 source: ' + path,
                  'branch': branch,
                  'content': base64.b64encode(root.joinpath(path).read_bytes()).decode('ascii'),
              }
              if existing and existing.get('sha'):
                  payload['sha'] = existing['sha']
              result = request('PUT', f'repos/{repository}/contents/{quoted}', payload)
              print(f"Recovered {path} at {result['commit']['sha']}")

          staging = [
              '.phase7-sync/package.b64',
              '.phase7-sync/chunk-00',
              '.phase7-sync/chunk-01',
              '.phase7-sync/chunk-02',
              '.phase7-sync/chunk-03',
              '.phase7-sync/chunk-04',
              '.phase7-sync/trigger',
          ]
          for path in staging:
              quoted = urllib.parse.quote(path, safe='/')
              existing = request('GET', f'repos/{repository}/contents/{quoted}?ref={urllib.parse.quote(branch)}')
              if not existing or not existing.get('sha'):
                  continue
              request('DELETE', f'repos/{repository}/contents/{quoted}', {
                  'message': 'Remove recovered Phase 7 staging data',
                  'branch': branch,
                  'sha': existing['sha'],
              })
              print('Removed ' + path)
          PY
