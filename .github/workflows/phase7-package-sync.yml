name: Phase 7 Package Sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.phase7-sync/**'
      - '.github/workflows/phase7-package-sync.yml'

permissions:
  contents: read

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone Phase 7 branch
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.head_ref }}" \
            "https://github.com/${{ github.repository }}.git" repo

      - name: Salvage Phase 7 source from staged ZIP records
        run: |
          set -euo pipefail
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import binascii
          import struct
          import zlib

          root = Path('.phase7-sync')
          encoded = ''.join(
              path.read_text(encoding='utf-8')
              for path in sorted(root.glob('chunk-*'))
          )
          cleaned = ''.join(encoded.split())
          padding = '=' * ((4 - len(cleaned) % 4) % 4)
          payload = base64.b64decode(cleaned + padding, validate=False)

          position = 0
          extracted = []
          truncated = None
          while position + 30 <= len(payload):
              signature = payload[position:position + 4]
              if signature != b'PK\x03\x04':
                  if signature in {b'PK\x01\x02', b'PK\x05\x06'}:
                      break
                  next_header = payload.find(b'PK\x03\x04', position + 1)
                  if next_header < 0:
                      break
                  position = next_header
                  continue

              (
                  _signature,
                  _version,
                  flags,
                  method,
                  _mod_time,
                  _mod_date,
                  expected_crc,
                  compressed_size,
                  uncompressed_size,
                  filename_length,
                  extra_length,
              ) = struct.unpack_from('<IHHHHHIIIHH', payload, position)

              name_start = position + 30
              name_end = name_start + filename_length
              extra_end = name_end + extra_length
              data_end = extra_end + compressed_size
              if data_end > len(payload):
                  truncated = payload[name_start:min(name_end, len(payload))].decode('utf-8', errors='replace')
                  break

              filename = payload[name_start:name_end].decode('utf-8')
              if flags & 0x08:
                  raise SystemExit(f'Unsupported data-descriptor entry: {filename}')
              if filename.startswith('/') or '..' in Path(filename).parts:
                  raise SystemExit(f'Unsafe archive path: {filename}')

              compressed = payload[extra_end:data_end]
              if method == 0:
                  content = compressed
              elif method == 8:
                  content = zlib.decompress(compressed, -15)
              else:
                  raise SystemExit(f'Unsupported compression method {method} for {filename}')

              if len(content) != uncompressed_size:
                  raise SystemExit(f'Uncompressed length mismatch for {filename}')
              if (binascii.crc32(content) & 0xFFFFFFFF) != expected_crc:
                  raise SystemExit(f'CRC mismatch for {filename}')

              destination = Path(filename)
              if filename.endswith('/'):
                  destination.mkdir(parents=True, exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(content)
              extracted.append(filename)
              position = data_end

          if not extracted:
              raise SystemExit('No complete Phase 7 source entries could be recovered.')

          Path('/tmp/phase7-recovered-files.txt').write_text(
              '\n'.join(extracted) + '\n',
              encoding='utf-8',
          )
          print(f'Recovered {len(extracted)} complete entries.')
          if truncated:
              print(f'First incomplete entry: {truncated}')
          for filename in extracted:
              print(filename)
          PY

      - name: Package recovered source
        run: |
          set -euo pipefail
          cd repo
          tar -czf /tmp/phase7-recovered-source.tar.gz -T /tmp/phase7-recovered-files.txt
          cp /tmp/phase7-recovered-files.txt /tmp/phase7-recovered-files-manifest.txt

      - name: Upload recovered Phase 7 source
        uses: actions/upload-artifact@v4
        with:
          name: phase7-recovered-source
          path: |
            /tmp/phase7-recovered-source.tar.gz
            /tmp/phase7-recovered-files-manifest.txt
          if-no-files-found: error
          retention-days: 3
