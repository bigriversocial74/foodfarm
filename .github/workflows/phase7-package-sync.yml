name: Phase 7 Package Sync

on:
  push:
    branches:
      - feature/phase7-planning-tasks-automation-20260725
    paths:
      - '.phase7-sync/**'
      - '.github/workflows/phase7-package-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Reassemble and validate Phase 7 package
        run: |
          set -euo pipefail
          cat .phase7-sync/chunk-* > /tmp/phase7-package.b64
          base64 --decode /tmp/phase7-package.b64 > /tmp/phase7-package.zip
          unzip -t /tmp/phase7-package.zip
          unzip -Z1 /tmp/phase7-package.zip

      - name: Extract authoritative Phase 7 source
        run: |
          set -euo pipefail
          unzip -o /tmp/phase7-package.zip -d .
          rm -rf .phase7-sync
          rm -f .github/workflows/phase7-package-sync.yml

      - name: Commit synchronized source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No Phase 7 changes to commit.'
            exit 0
          fi
          git commit -m 'Synchronize Phase 7 planning and automation source'
          git push
