name: Phase 7 Package Sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.phase7-sync/**'
      - '.github/workflows/phase7-package-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Reassemble and validate Phase 7 package
        run: |
          set -euo pipefail
          decode_package() {
            local source_file="$1"
            tr -d '\r\n\t ' < "$source_file" | base64 --decode --ignore-garbage > /tmp/phase7-package.zip
            unzip -t /tmp/phase7-package.zip
          }

          if decode_package .phase7-sync/package.b64; then
            echo 'Validated complete Phase 7 package.'
          else
            echo 'Complete package did not validate; trying ordered chunks.'
            cat .phase7-sync/chunk-* > /tmp/phase7-package.b64
            decode_package /tmp/phase7-package.b64
          fi
          unzip -Z1 /tmp/phase7-package.zip

      - name: Extract authoritative Phase 7 source
        run: |
          set -euo pipefail
          unzip -o /tmp/phase7-package.zip -d .
          rm -rf .phase7-sync
          rm -f .github/workflows/phase7-package-sync.yml

      - name: Commit synchronized source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No Phase 7 changes to commit.'
            exit 0
          fi
          git commit -m 'Synchronize Phase 7 planning and automation source'
          git push origin HEAD:${{ github.head_ref }}
