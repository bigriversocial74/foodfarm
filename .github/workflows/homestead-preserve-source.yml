name: Homestead Preserve Source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-preserve-source.yml

permissions:
  contents: read

jobs:
  upload-preserve-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Upload preserve source
        uses: actions/upload-artifact@v4
        with:
          name: homestead-preserve-source
          path: |
            phase6.php
            app/bootstrap.php
            assets/css/homestead-garden.css
            assets/js/homestead-garden.js
          if-no-files-found: error
          retention-days: 1
