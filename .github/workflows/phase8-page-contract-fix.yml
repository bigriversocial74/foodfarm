name: Phase 8 Page Contract Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase8-page-contract-fix.yml'

permissions:
  contents: write

jobs:
  repair-page-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out forecast branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore Phase 8 compatibility identifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('phase8.php')
          source = path.read_text()
          marker = "declare(strict_types=1);\n"
          contract = "\n// Compatibility identifier: Forecasting, Seasons & Self-Sufficiency\n"
          if 'Forecasting, Seasons & Self-Sufficiency' not in source:
              if marker not in source:
                  raise SystemExit('Phase 8 declaration marker not found')
              source = source.replace(marker, marker + contract, 1)
              path.write_text(source)
          PY
          php -l phase8.php
          php tests/phase8_static_audit.php
          rm -f .github/workflows/phase8-page-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Phase 8 page contract"
          git push origin HEAD:${{ github.head_ref }}
