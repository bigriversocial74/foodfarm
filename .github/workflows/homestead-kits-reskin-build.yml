name: Homestead Starter Kits Reskin Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/homestead-kits-reskin-build.yml'
      - '.reskin/kits/**'

permissions:
  contents: write

jobs:
  build-kits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out starter-kits branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate Starter Kits package
        shell: bash
        run: |
          set -euo pipefail
          test -f .reskin/kits/package.tar.gz
          test "$(wc -c < .reskin/kits/package.tar.gz)" = "14163"
          echo "31f5fcbf649b45f8f55aef806ed0514115fc2bf5a77d8d55625b8235b9b8b710  .reskin/kits/package.tar.gz" | sha256sum -c -
          rm -rf /tmp/kits-build
          mkdir -p /tmp/kits-build
          tar -xzf .reskin/kits/package.tar.gz -C /tmp/kits-build
          php -l /tmp/kits-build/phase5.php
          php -l /tmp/kits-build/app/bootstrap.php
          node --check /tmp/kits-build/assets/js/homestead-kits.js
          for action in create_kit create_version publish_version add_item attach_recipe add_task create_order; do
            grep -q "'$action'" /tmp/kits-build/phase5.php
          done
          grep -q 'Build the kit' /tmp/kits-build/phase5.php
          grep -q 'Version pipeline' /tmp/kits-build/phase5.php
          grep -q 'Fulfillment contents' /tmp/kits-build/phase5.php
          grep -q 'Orders & activations' /tmp/kits-build/phase5.php
          grep -q "phase5.php'.*homestead-kits.css" /tmp/kits-build/app/bootstrap.php
          ! grep -Eiq '\b(CREATE|ALTER|DROP)[[:space:]]+TABLE\b' /tmp/kits-build/phase5.php
          ! grep -E 'href="/|src="/' /tmp/kits-build/phase5.php

      - name: Commit Starter Kits rebuild
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kits-build/phase5.php phase5.php
          cp /tmp/kits-build/app/bootstrap.php app/bootstrap.php
          cp /tmp/kits-build/assets/css/homestead-kits.css assets/css/homestead-kits.css
          cp /tmp/kits-build/assets/js/homestead-kits.js assets/js/homestead-kits.js
          rm -f .github/workflows/homestead-kits-reskin-build.yml
          rm -rf .reskin/kits
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          ! echo "$changed" | grep -E '^(database/|app/(StarterKitService|Auth|Database|.*Service)\.php)'
          git commit -m "Reskin Homestead starter kits"
          git push origin HEAD:${{ github.head_ref }}
