name: Homestead Account Reskin Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/homestead-account-reskin-build.yml'
      - '.reskin/account/**'

permissions:
  contents: write

jobs:
  build-account:
    runs-on: ubuntu-latest
    steps:
      - name: Check out account branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct Account package
        shell: bash
        run: |
          set -euo pipefail
          cat .reskin/account/chunk-* > /tmp/account.b64
          test "$(wc -c < /tmp/account.b64)" = "10584"
          echo "40041c306f43b3d6145c694982d055bf67a1b79b3fec28383c9a11864fbb8bc5  /tmp/account.b64" | sha256sum -c -
          base64 -d /tmp/account.b64 > /tmp/account.tar.gz
          echo "32ee05c876d34c4e305cc9b317518ce23c7eeb77661c32a94f4718e54b2e4253  /tmp/account.tar.gz" | sha256sum -c -
          rm -rf /tmp/account-build
          mkdir -p /tmp/account-build
          tar -xzf /tmp/account.tar.gz -C /tmp/account-build

      - name: Validate Account rebuild
        shell: bash
        run: |
          set -euo pipefail
          php -l /tmp/account-build/account.php
          node --check /tmp/account-build/assets/js/homestead-account.js
          grep -Fq "status = 'active' FOR UPDATE" /tmp/account-build/account.php
          grep -Fq 'password_change_failure' /tmp/account-build/account.php
          grep -Fq 'INTERVAL 15 MINUTE' /tmp/account-build/account.php
          grep -Fq 'auth_version = ?' /tmp/account-build/account.php
          grep -Fq 'newAuthVersion' /tmp/account-build/account.php
          grep -Fq 'Account security' /tmp/account-build/account.php
          grep -Fq 'Change password' /tmp/account-build/account.php
          ! grep -Eiq '\b(CREATE|ALTER|DROP)[[:space:]]+TABLE\b' /tmp/account-build/account.php
          ! grep -E 'href="/|src="/' /tmp/account-build/account.php

      - name: Commit Account rebuild
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/account-build/account.php account.php
          cp /tmp/account-build/assets/css/homestead-account.css assets/css/homestead-account.css
          cp /tmp/account-build/assets/js/homestead-account.js assets/js/homestead-account.js
          python - <<'PY'
          from pathlib import Path
          path = Path('app/bootstrap.php')
          source = path.read_text()
          old = "'account.php' => ['class' => 'ui-account', 'stylesheet' => 'intelligence-pages.css'],"
          new = "'account.php' => ['class' => 'ui-account', 'stylesheet' => 'homestead-account.css'],"
          if old not in source:
              raise SystemExit('Expected Account route mapping not found')
          path.write_text(source.replace(old, new, 1))
          PY
          php -l app/bootstrap.php
          TERM=xterm php tests/application_static_audit.php
          grep -q "account.php'.*homestead-account.css" app/bootstrap.php
          rm -f .github/workflows/homestead-account-reskin-build.yml
          rm -rf .reskin/account
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          ! echo "$changed" | grep -E '^(database/|app/(Auth|Database|.*Service)\.php)'
          git commit -m "Reskin Homestead account and security"
          git push origin HEAD:${{ github.head_ref }}
