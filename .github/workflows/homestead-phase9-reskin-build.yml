name: Homestead Phase 9 Reskin Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/homestead-phase9-reskin-build.yml'
      - '.reskin/phase9/**'

permissions:
  contents: write

jobs:
  build-phase9:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct Phase 9 package
        shell: bash
        run: |
          set -euo pipefail
          cat .reskin/phase9/chunk-* > /tmp/phase9.b64
          test "$(wc -c < /tmp/phase9.b64)" = "20124"
          echo "d2e990e9af0ff1411d2ce88a9e5c6b84a6a0c1ea05af49af1c1387ca591d8897  /tmp/phase9.b64" | sha256sum -c -
          base64 -d /tmp/phase9.b64 > /tmp/phase9.tar.gz
          echo "c4afe9a357551dddbaae6c477c6ad3be7579a5bc18097f01d6b6dd96af7945ca  /tmp/phase9.tar.gz" | sha256sum -c -
          rm -rf /tmp/phase9-build
          mkdir -p /tmp/phase9-build
          tar -xzf /tmp/phase9.tar.gz -C /tmp/phase9-build

      - name: Validate Phase 9 rebuild
        shell: bash
        run: |
          set -euo pipefail
          php -l /tmp/phase9-build/phase9.php
          php -l /tmp/phase9-build/app/bootstrap.php
          node --check /tmp/phase9-build/assets/js/homestead-finance.js
          for action in save_settings create_supplier record_purchase record_waste calculate_recipe_cost run_finance_snapshot accept_recommendation dismiss_recommendation complete_recommendation; do
            grep -q "'$action'" /tmp/phase9-build/phase9.php
          done
          grep -Fq 'Cost, Waste & Savings Intelligence' /tmp/phase9-build/phase9.php
          grep -Fq 'Cost and waste recommendations' /tmp/phase9-build/phase9.php
          grep -Fq 'Recent purchases' /tmp/phase9-build/phase9.php
          grep -Fq 'Supplier and package-cost comparison' /tmp/phase9-build/phase9.php
          grep -Fq 'Monthly trend history' /tmp/phase9-build/phase9.php
          grep -q "phase9.php'.*homestead-finance.css" /tmp/phase9-build/app/bootstrap.php
          ! grep -Eiq '\b(CREATE|ALTER|DROP)[[:space:]]+TABLE\b' /tmp/phase9-build/phase9.php
          ! grep -E 'href="/|src="/' /tmp/phase9-build/phase9.php

      - name: Commit Phase 9 rebuild
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase9-build/phase9.php phase9.php
          cp /tmp/phase9-build/app/bootstrap.php app/bootstrap.php
          cp /tmp/phase9-build/assets/css/homestead-finance.css assets/css/homestead-finance.css
          cp /tmp/phase9-build/assets/js/homestead-finance.js assets/js/homestead-finance.js
          php tests/phase9_static_audit.php
          rm -f .github/workflows/homestead-finance-source.yml
          rm -f .github/workflows/homestead-phase9-reskin-build.yml
          rm -rf .reskin/phase9
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          ! echo "$changed" | grep -E '^(database/|app/(CostWasteService|Auth|Database|.*Service)\.php)'
          git commit -m "Reskin Homestead costs, waste, and savings intelligence"
          git push origin HEAD:${{ github.head_ref }}
