name: Homestead Public Visual Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-public-visual-build.yml

permissions:
  contents: write

jobs:
  build-public-visual-system:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Write dark public templates
        shell: bash
        run: |
          python - <<'PY'
          from base64 import b64decode
          from gzip import decompress
          from pathlib import Path

          payload = {
  "index.php": "",
  "login.php": "",
  "accept-invite.php": "",
  "activate-kit.php": "",
  "assets/css/homestead-public.css": "",
  "assets/js/homestead-public.js": ""
}

          for relative_path, encoded in payload.items():
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decompress(b64decode(encoded)))
              print(f"Wrote {relative_path}")
          PY

      - name: Validate public visual rebuild
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          php -l login.php
          php -l accept-invite.php
          php -l activate-kit.php

          if grep -nE '(href|src)="/(assets|manifest|login\.php)' index.php login.php accept-invite.php activate-kit.php; then
            echo "Root-only public asset path detected."
            exit 1
          fi

          test -f assets/images/homestead/sheet-04/garden-monitoring-wide.png
          test -f assets/images/homestead/sheet-05/preservation-jars-wide.png
          test -f assets/images/homestead/sheet-05/dehydrated-food-jars.png
          grep -q 'assets/css/homestead-public.css' index.php
          grep -q 'assets/css/homestead-public.css' login.php
          grep -q 'assets/css/homestead-public.css' accept-invite.php
          grep -q 'assets/css/homestead-public.css' activate-kit.php
          grep -q 'name="csrf_token"' login.php
          grep -q 'name="csrf_token"' accept-invite.php
          grep -q 'name="csrf_token"' activate-kit.php
          grep -q 'name="email"' login.php
          grep -q 'name="password"' login.php
          grep -q 'name="password_confirmation"' accept-invite.php
          grep -q 'name="fulfillment_type' activate-kit.php
          grep -q 'name="status' activate-kit.php

          echo "Public visual rebuild validation passed."

      - name: Commit public visual rebuild
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.php login.php accept-invite.php activate-kit.php assets/css/homestead-public.css assets/js/homestead-public.js
          if git diff --cached --quiet; then
            echo "Public visual files are unchanged."
            exit 0
          fi
          git commit -m "Build Homestead dark public and access pages"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload public visual files
        uses: actions/upload-artifact@v4
        with:
          name: homestead-public-visual-build
          path: |
            index.php
            login.php
            accept-invite.php
            activate-kit.php
            assets/css/homestead-public.css
            assets/js/homestead-public.js
          if-no-files-found: error
          retention-days: 7
