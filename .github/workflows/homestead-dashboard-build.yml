name: Homestead Authenticated Dashboard Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-dashboard-build.yml

permissions:
  contents: write

jobs:
  build-authenticated-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct dashboard build
        shell: bash
        run: |
          set -euo pipefail
          cat .homestead-build/dashboard-build.part-* > /tmp/dashboard-build.b64
          base64 --decode /tmp/dashboard-build.b64 > /tmp/dashboard-build.tar.gz
          echo "e354586104d7844b5e0d3a0e50bb639ba9f97b6b3ba01a5063a4fb00dab51fa9  /tmp/dashboard-build.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/dashboard-build.tar.gz

      - name: Validate authenticated shell and dashboard
        shell: bash
        run: |
          set -euo pipefail
          php -l app/bootstrap.php
          php -l dashboard.php
          node --check assets/js/homestead-app-shell.js

          if grep -RInE '(href|src)="/(assets|dashboard\.php|phase[0-9]+\.php|account\.php|logout\.php)' app/bootstrap.php dashboard.php assets/css/app-shell.css assets/css/homestead-dashboard.css assets/js/homestead-app-shell.js; then
            echo "Root-only route or asset path detected."
            exit 1
          fi

          if grep -nE '\b(INSERT|UPDATE|DELETE|ALTER|CREATE TABLE|DROP TABLE)\b' dashboard.php; then
            echo "Unexpected write SQL found in dashboard.php."
            exit 1
          fi

          grep -q "'visible' => \$canAny" app/bootstrap.php
          grep -q 'box-sizing: border-box' assets/css/homestead-dashboard.css
          grep -q 'if (\$canViewInventory)' dashboard.php
          grep -q 'if (\$canViewGarden)' dashboard.php
          grep -q 'if (\$canViewPreservation)' dashboard.php
          test -f assets/images/homestead/sheet-04/garden-monitoring-wide.png
          test -f assets/images/homestead/sheet-05/preservation-jars-wide.png
          test -f assets/images/homestead/sheet-05/dehydrated-food-jars.png
          echo "Authenticated dashboard validation passed."

      - name: Commit authenticated shell and dashboard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .homestead-build .github/workflows/homestead-dashboard-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bootstrap.php dashboard.php assets/css/app-shell.css assets/css/homestead-dashboard.css assets/js/homestead-app-shell.js
          git add -u .github/workflows .homestead-build
          if git diff --cached --quiet; then
            echo "Authenticated dashboard files are unchanged."
            exit 0
          fi
          git commit -m "Build Homestead authenticated shell and dashboard"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
