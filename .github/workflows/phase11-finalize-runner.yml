name: Phase 11 Finalize Runner

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase11-finalize-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'feature/phase11-alerts-calendar-notifications-20260725' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-alerts-calendar-notifications-20260725
          fetch-depth: 0

      - name: Extract and run final integration script
        run: |
          set -euo pipefail
          awk '
            /^          python3 - <<'"'"'PY'"'"'$/ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/phase11-finalize-sync.yml > /tmp/phase11-finalize.py
          test -s /tmp/phase11-finalize.py
          python3 /tmp/phase11-finalize.py
          rm -f .github/workflows/phase11-finalize-runner.yml

      - name: Validate final integration
        run: |
          set -euo pipefail
          find app -maxdepth 1 -type f -name 'Notification*.php' -print0 | xargs -0 -n1 php -l
          php -l phase3.php
          php -l dashboard.php
          php -l tests/database_integration_audit.php
          php -l tests/application_static_audit.php
          php tests/phase11_static_audit.php
          php tests/application_static_audit.php

      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Phase 11 privacy and application integration"
          git push origin HEAD:feature/phase11-alerts-calendar-notifications-20260725
