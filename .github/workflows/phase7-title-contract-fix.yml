name: Phase 7 Title Contract Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase7-title-contract-fix.yml'

permissions:
  contents: write

jobs:
  repair-title-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planning branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore Phase 7 page identifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('phase7.php')
          source = path.read_text()
          old = '<h1 id="planning-title">Plan the work.<br><span>Run the household.</span></h1>'
          new = '<h1 id="planning-title" aria-label="Planning, Tasks & Automation">Plan the work.<br><span>Run the household.</span></h1>'
          if old not in source:
              raise SystemExit('Expected planning heading not found')
          path.write_text(source.replace(old, new, 1))
          PY
          php -l phase7.php
          grep -Fq 'Planning, Tasks & Automation' phase7.php
          rm -f .github/workflows/phase7-title-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Phase 7 page title contract"
          git push origin HEAD:${{ github.head_ref }}
