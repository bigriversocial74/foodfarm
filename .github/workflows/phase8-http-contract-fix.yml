name: Phase 8 HTTP Contract Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase8-http-contract-fix.yml'

permissions:
  contents: write

jobs:
  repair-http-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out forecast branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore Phase 8 rendered headings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('phase8.php')
          source = path.read_text()
          replacements = {
              '<p class="forecast-kicker">Pantry demand model</p><h2>Coverage outlook</h2>': '<p class="forecast-kicker">Coverage outlook</p><h2>Item projections</h2>',
              '<p class="forecast-kicker">Forecast history</p><h2>Resilience trend</h2>': '<p class="forecast-kicker">Resilience trend</p><h2>Snapshot trend</h2>',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected Phase 8 heading not found: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          php -l phase8.php
          php tests/phase8_static_audit.php
          grep -Fq 'Item projections' phase8.php
          grep -Fq 'Snapshot trend' phase8.php
          rm -f .github/workflows/phase8-http-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Phase 8 HTTP page contract"
          git push origin HEAD:${{ github.head_ref }}
