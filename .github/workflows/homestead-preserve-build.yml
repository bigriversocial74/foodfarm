name: Homestead Preserve Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-preserve-build.yml

permissions:
  contents: write

jobs:
  build-preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct preservation build
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .homestead-build/preserve-build.part-00 \
            .homestead-build/preserve-build.part-01 \
            .homestead-build/preserve-build.part-02 \
            .homestead-build/preserve-build.part-03 \
            .homestead-build/preserve-build.part-04 \
            .homestead-build/preserve-build.part-05 \
            .homestead-build/preserve-build.part-06 \
            > /tmp/preserve-build.b64
          test "$(wc -c < /tmp/preserve-build.b64)" -eq 26396
          echo "850d42a966341c7561e8ff0c9c5a7db62d0fd4a3f30db2c6cd3e3f5732f0648f  /tmp/preserve-build.b64" | sha256sum --check --strict
          base64 --decode /tmp/preserve-build.b64 > /tmp/preserve-build.tar.gz
          echo "eae1d6c43dcc8008218657874ca5031a3be5d445613f41c6b1d599bd09d55072  /tmp/preserve-build.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/preserve-build.tar.gz

      - name: Validate preservation build
        shell: bash
        run: |
          set -euo pipefail
          php -l phase6.php
          php -l app/bootstrap.php
          node --check assets/js/homestead-preserve.js

          if grep -RInE '(href|src)="/(assets|dashboard\.php|phase[0-9]+\.php|account\.php|logout\.php)' phase6.php app/bootstrap.php assets/css/homestead-preserve.css assets/js/homestead-preserve.js; then
            echo "Root-only route or asset path detected."
            exit 1
          fi

          if grep -nE '\b(ALTER|CREATE TABLE|DROP TABLE)\b' phase6.php; then
            echo "Unexpected schema SQL found in phase6.php."
            exit 1
          fi

          grep -q 'homestead-preserve.css' app/bootstrap.php
          grep -q 'Preservation Tracking' phase6.php
          grep -q 'Preservation Timeline' phase6.php
          grep -q 'data-preserve-search' phase6.php
          grep -q 'data-preserve-method' phase6.php
          grep -q 'name="action" value="create_zone"' phase6.php
          grep -q 'name="action" value="create_planting"' phase6.php
          grep -q 'name="action" value="record_reading"' phase6.php
          grep -q 'name="action" value="update_stage"' phase6.php
          grep -q 'name="action" value="record_harvest"' phase6.php
          grep -q 'name="action" value="complete_preservation"' phase6.php
          test -f assets/images/homestead/sheet-05/preservation-jars-wide.png
          test -f assets/images/homestead/sheet-05/dehydrated-food-jars.png
          test -f assets/images/homestead/sheet-05/fermentation-crock.png
          test -f assets/images/homestead/sheet-05/labeled-pickle-jar.png
          echo "Preservation build validation passed."

      - name: Commit preservation tracking build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .homestead-build
          rm -f .github/workflows/homestead-preserve-source.yml
          rm -f .github/workflows/homestead-preserve-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase6.php app/bootstrap.php assets/css/homestead-preserve.css assets/js/homestead-preserve.js
          git add -u .github/workflows .homestead-build
          git commit -m "Build Homestead preservation tracking experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
