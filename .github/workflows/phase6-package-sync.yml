name: Phase 6 Package Sync

on:
  push:
    branches:
      - feature/phase6-grow-harvest-preserve-20260725
    paths:
      - '.phase6-sync/**'
      - '.github/workflows/phase6-package-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct authoritative Phase 6 package
        shell: bash
        run: |
          set -euo pipefail
          cat .phase6-sync/package.*.b64 | base64 --decode > /tmp/homestead-phase6.zip
          mkdir -p /tmp/homestead-phase6
          unzip -q /tmp/homestead-phase6.zip -d /tmp/homestead-phase6
          cp -a /tmp/homestead-phase6/. .
          rm -rf .phase6-sync

      - name: Validate authoritative package
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          bash -n tests/phase6_http_smoke.sh
          php tests/phase6_static_audit.php
          test "$(git hash-object app/GrowPreserveService.php)" = "04bf4c37c2552cd32e76473df231f4f248c97fdf"
          test "$(git hash-object phase6.php)" = "378b47b18b9edc3066e1da64189d8c5051911f50"

      - name: Commit authoritative Phase 6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync authoritative Phase 6 source package"
          git push
