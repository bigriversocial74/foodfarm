name: Homestead Login Session Fix Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/login-session-fix-build.yml'
      - '.release-fix/login-session/**'

permissions:
  contents: write

jobs:
  build-login-session-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct verified repair package
        shell: bash
        run: |
          set -euo pipefail
          cat .release-fix/login-session/chunk-* > /tmp/login-session-fix.b64
          test "$(wc -c < /tmp/login-session-fix.b64)" = "13936"
          echo "e4392a97efe3def5a90128f2a80cdc275b26ab1b4ce5f4bfcbca441ce6af07ef  /tmp/login-session-fix.b64" | sha256sum -c -
          base64 -d /tmp/login-session-fix.b64 > /tmp/login-session-fix.tar.gz
          echo "5ceab92653cd4312279bc3063923413c7d10052c04a0dc7e82017ef319b7610e  /tmp/login-session-fix.tar.gz" | sha256sum -c -
          rm -rf /tmp/login-session-fix
          mkdir -p /tmp/login-session-fix
          tar -xzf /tmp/login-session-fix.tar.gz -C /tmp/login-session-fix

      - name: Validate session and login repair
        shell: bash
        run: |
          set -euo pipefail
          php -l /tmp/login-session-fix/app/bootstrap.php
          php -l /tmp/login-session-fix/app/Support.php
          php -l /tmp/login-session-fix/login.php
          php -l /tmp/login-session-fix/tests/session_cookie_policy_test.php
          cp /tmp/login-session-fix/app/Support.php app/Support.php
          cp /tmp/login-session-fix/app/bootstrap.php app/bootstrap.php
          cp /tmp/login-session-fix/login.php login.php
          cp /tmp/login-session-fix/tests/session_cookie_policy_test.php tests/session_cookie_policy_test.php
          php tests/session_cookie_policy_test.php
          grep -Fq "'path' => \$basePath !== '' ? \$basePath . '/' : '/'" app/bootstrap.php
          grep -Fq "'secure' => \$requestUsesHttps" app/bootstrap.php
          grep -Fq 'csrf_is_valid' login.php
          grep -Fq '$auth->attempt($email, $password)' login.php
          grep -Fq 'session_regenerate_id' app/Auth.php

      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/login-session-fix-build.yml
          rm -rf .release-fix/login-session
          test -f app/Support.php
          test -f app/bootstrap.php
          test -f login.php
          test -f tests/session_cookie_policy_test.php
          test ! -e .github/workflows/login-session-fix-build.yml
          test ! -e .release-fix/login-session
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-status
          ! git diff --cached --quiet
          git commit -m "Fix login session persistence and CSRF feedback"
          git push origin HEAD:${{ github.head_ref }}
