name: Phase 11 Calendar Fix

on:
  push:
    branches:
      - feature/phase11-alerts-calendar-notifications-20260725

permissions:
  contents: write

concurrency:
  group: phase11-calendar-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-alerts-calendar-notifications-20260725
          fetch-depth: 0

      - name: Apply private calendar persistence fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/NotificationSyncTrait.php')
          text = path.read_text()

          replacements = [
              ("                    'event_seed' => 'task|' . (int)$task['id'],\n", "                    'event_seed' => 'task|' . (int)$task['id'],\n                    'recipient_member_id' => $recipientId,\n"),
              ("                    'event_seed' => 'prepared-use-by|' . (int)$batch['id'],\n", "                    'event_seed' => 'prepared-use-by|' . (int)$batch['id'],\n                    'recipient_member_id' => null,\n"),
              ("                        'event_seed' => 'forecast-shortage|' . (int)$projection['inventory_item_id'],\n", "                        'event_seed' => 'forecast-shortage|' . (int)$projection['inventory_item_id'],\n                        'recipient_member_id' => null,\n"),
              ("                    'event_seed' => 'seasonal|' . (int)$entry['id'],\n", "                    'event_seed' => 'seasonal|' . (int)$entry['id'],\n                    'recipient_member_id' => $recipientId,\n"),
              ("                    'event_seed' => 'meal|' . (int)$meal['id'],\n", "                    'event_seed' => 'meal|' . (int)$meal['id'],\n                    'recipient_member_id' => null,\n"),
              ("                    'event_seed' => 'harvest-window|' . (int)$planting['id'],\n", "                    'event_seed' => 'harvest-window|' . (int)$planting['id'],\n                    'recipient_member_id' => null,\n"),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Missing event marker: {old!r}')
              text = text.replace(old, new, 1)

          old = """        $statement = $this->pdo->prepare(
            'INSERT INTO household_calendar_events
             (household_id, notification_id, source_type, source_id, event_key, title, description,
              starts_at, ends_at, all_day, visibility, status, created_by_member_id)
             VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, \"scheduled\", ?)
             ON DUPLICATE KEY UPDATE
                notification_id = VALUES(notification_id),
"""
          new = """        $recipientId = $data['recipient_member_id'] !== null
            ? (int)$data['recipient_member_id']
            : null;
        if ($recipientId !== null) {
            $this->assertHouseholdMember($householdId, $recipientId);
        }
        $statement = $this->pdo->prepare(
            'INSERT INTO household_calendar_events
             (household_id, notification_id, recipient_member_id, source_type, source_id,
              event_key, title, description, starts_at, ends_at, all_day, visibility,
              status, created_by_member_id)
             VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, \"scheduled\", ?)
             ON DUPLICATE KEY UPDATE
                notification_id = VALUES(notification_id),
                recipient_member_id = VALUES(recipient_member_id),
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Calendar insert marker missing')
              text = text.replace(old, new, 1)

          old = """        $statement->execute([
            $householdId,
            $notificationId,
            $this->text($data['source_type'], 80, 'Calendar source type'),
"""
          new = """        $statement->execute([
            $householdId,
            $notificationId,
            $recipientId,
            $this->text($data['source_type'], 80, 'Calendar source type'),
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Calendar execute marker missing')
              text = text.replace(old, new, 1)

          old = """        foreach ($memberIds as $recipientId) {
            $preference = $this->memberPreference($householdId, $recipientId);
"""
          new = """        foreach ($memberIds as $recipientId) {
            $notificationRecipientId = $notification['recipient_member_id'] !== null
                ? (int)$notification['recipient_member_id']
                : null;
            if (!$this->canAccessVisibility(
                $householdId,
                $recipientId,
                (string)$notification['visibility'],
                $notificationRecipientId
            )) {
                continue;
            }
            $preference = $this->memberPreference($householdId, $recipientId);
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('Outbox visibility marker missing')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/phase11-calendar-fix.yml').unlink()
          PY

      - name: Validate patch
        run: |
          php -l app/NotificationSyncTrait.php
          php tests/phase11_static_audit.php

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 11 private calendar persistence"
          git push origin HEAD:feature/phase11-alerts-calendar-notifications-20260725
