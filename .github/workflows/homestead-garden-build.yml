name: Homestead Garden Build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/homestead-garden-build.yml

permissions:
  contents: write

jobs:
  build-garden:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Reconstruct garden build
        shell: bash
        run: |
          set -euo pipefail
          cat .homestead-build/garden-build.part-* > /tmp/garden-build.b64
          base64 --decode /tmp/garden-build.b64 > /tmp/garden-build.tar.gz
          echo "e6378d10f523ac0907fb5a3ba6a89a36982403715a3498f72d1d4acdffea74f1  /tmp/garden-build.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/garden-build.tar.gz

      - name: Validate garden build
        shell: bash
        run: |
          set -euo pipefail
          php -l phase6.php
          php -l app/bootstrap.php
          node --check assets/js/homestead-garden.js

          if grep -RInE '(href|src)="/(assets|dashboard\.php|phase[0-9]+\.php|account\.php|logout\.php)' phase6.php app/bootstrap.php assets/css/homestead-garden.css assets/js/homestead-garden.js; then
            echo "Root-only route or asset path detected."
            exit 1
          fi

          if grep -nE '\b(ALTER|CREATE TABLE|DROP TABLE)\b' phase6.php; then
            echo "Unexpected schema SQL found in phase6.php."
            exit 1
          fi

          grep -q "'phase6.php' => \['class' => 'ui-grow', 'stylesheet' => 'homestead-garden.css'\]" app/bootstrap.php
          grep -q 'Grow Room Overview' phase6.php
          grep -q 'Environmental History' phase6.php
          grep -q 'name="action" value="create_zone"' phase6.php
          grep -q 'name="action" value="create_planting"' phase6.php
          grep -q 'name="action" value="record_reading"' phase6.php
          grep -q 'name="action" value="update_stage"' phase6.php
          grep -q 'name="action" value="record_harvest"' phase6.php
          grep -q 'name="action" value="complete_preservation"' phase6.php
          test -f assets/images/homestead/sheet-04/garden-monitoring-wide.png
          test -f assets/images/homestead/sheet-04/indoor-grow-racks.png
          test -f assets/images/homestead/sheet-04/basil-grow-light-closeup.png
          echo "Garden build validation passed."

      - name: Commit garden monitoring build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .homestead-build
          rm -f .github/workflows/homestead-garden-source.yml
          rm -f .github/workflows/homestead-garden-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase6.php app/bootstrap.php assets/css/homestead-garden.css assets/js/homestead-garden.js
          git add -u .github/workflows .homestead-build
          git commit -m "Build Homestead garden monitoring experience"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
