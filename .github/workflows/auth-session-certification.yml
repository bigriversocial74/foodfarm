name: Homestead Auth Session Certification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homestead-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-session:
    name: auth-session (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql-8
            image: mysql:8.0
          - database: mariadb-10.11
            image: mariadb:10.11
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homestead
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_PWD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: homestead
      DB_USER: root
      DB_PASSWORD: root
      HOMESTEAD_OWNER_EMAIL: owner@example.test
      HOMESTEAD_OWNER_PASSWORD: CI-Only-Owner-Password-2026!
      HOMESTEAD_OWNER_NAME: CI Owner
      HOMESTEAD_HOUSEHOLD_NAME: CI Homestead
      HOMESTEAD_HOUSEHOLD_SLUG: ci-homestead
      HOMESTEAD_HOUSEHOLD_TIMEZONE: America/Phoenix
      HOMESTEAD_PLATFORM_ADMIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Install schema
        run: |
          set -euo pipefail
          for file in \
            database/schema.sql \
            database/phase2_install.sql \
            database/phase3_install.sql \
            database/phase4_install.sql \
            database/phase4_hardening.sql \
            database/phase5_install.sql \
            database/phase5_shopping_extension.sql \
            database/phase5_hardening.sql \
            database/phase5_snapshot_storage_hardening.sql
          do
            mysql --host=127.0.0.1 --port=3306 --user=root homestead < "$file"
          done
      - name: Bootstrap owner and certify authentication sessions
        run: |
          php bin/create-owner.php
          php tests/auth_login_integration.php
