name: Phase 7 Staging Artifact

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase7-staging-artifact.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Upload staged package data
        uses: actions/upload-artifact@v4
        with:
          name: phase7-staging-data
          path: .phase7-sync
          if-no-files-found: error
          retention-days: 3
