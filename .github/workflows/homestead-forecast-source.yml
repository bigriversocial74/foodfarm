name: Homestead Forecast Source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/homestead-forecast-source.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out forecast branch
        uses: actions/checkout@v4

      - name: Confirm expected baseline
        run: |
          test -f phase8.php
          test -f app/bootstrap.php
          test -f app/ForecastingService.php
          test -f assets/css/intelligence-pages.css

      - name: Upload forecast source
        uses: actions/upload-artifact@v4
        with:
          name: homestead-forecast-source
          retention-days: 1
          include-hidden-files: true
          path: |
            .
            !.git/**
            !storage/**
            !config.php
