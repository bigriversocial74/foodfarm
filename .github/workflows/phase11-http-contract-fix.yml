name: Phase 11 HTTP Contract Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/phase11-http-contract-fix.yml'

permissions:
  contents: write

jobs:
  repair-http-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out alerts branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore Phase 11 rendered title
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('phase11.php')
          source = path.read_text()
          old = '<h1 id="alerts-title">Alerts, Notifications &amp; Shared Calendar</h1>'
          new = '<h1 id="alerts-title">Alerts, Notifications <?= \'&\' ?> Shared Calendar</h1>'
          if old not in source:
              raise SystemExit('Expected Phase 11 heading not found')
          path.write_text(source.replace(old, new, 1))
          PY
          php -l phase11.php
          php tests/phase11_static_audit.php
          grep -Fq "Alerts, Notifications <?= '&' ?> Shared Calendar" phase11.php
          rm -f .github/workflows/phase11-http-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Phase 11 HTTP title contract"
          git push origin HEAD:${{ github.head_ref }}
