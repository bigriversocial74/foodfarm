name: Homestead Mockup Preview

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/homestead-mockup-preview.yml

permissions:
  contents: read

jobs:
  upload-mockups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Upload named page mockups
        uses: actions/upload-artifact@v4
        with:
          name: homestead-named-page-mockups
          path: |
            homestead_main.png
            homestead_dashboard.png
            homestead_pantry.png
            homestead_recipes.png
            homestead_garden.png
            homestead_preserve.png
            homestead_list.png
          if-no-files-found: error
          retention-days: 1
