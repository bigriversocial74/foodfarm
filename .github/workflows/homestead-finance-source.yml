name: Homestead Finance Source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/homestead-finance-source.yml'

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out finance branch
        uses: actions/checkout@v4
      - name: Confirm Phase 9 baseline
        run: |
          test -f phase9.php
          test -f app/bootstrap.php
          test -f app/CostWasteService.php
          php -l phase9.php
          php tests/phase9_static_audit.php
