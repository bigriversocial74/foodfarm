name: Homestead Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: homestead-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-validation:
    name: application-validation (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql-8
            image: mysql:8.0
          - database: mariadb-10.11
            image: mariadb:10.11
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homestead
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_PWD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: homestead
      DB_USER: root
      DB_PASSWORD: root
      HOMESTEAD_OWNER_EMAIL: owner@example.test
      HOMESTEAD_OWNER_PASSWORD: CI-Only-Owner-Password-2026!
      HOMESTEAD_OWNER_NAME: CI Owner
      HOMESTEAD_HOUSEHOLD_NAME: CI Homestead
      HOMESTEAD_HOUSEHOLD_SLUG: ci-homestead
      HOMESTEAD_HOUSEHOLD_TIMEZONE: America/Phoenix
      HOMESTEAD_PLATFORM_ADMIN: '1'
      HOMESTEAD_HEALTH_KEY: ci-health-key-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Lint PHP files
        run: |
          set +e
          report="$RUNNER_TEMP/php-lint-${{ matrix.database }}.txt"
          : > "$report"
          result=0
          while IFS= read -r -d '' file; do
            echo "=== $file ===" >> "$report"
            php -l "$file" >> "$report" 2>&1 || result=1
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          cat "$report"
          exit "$result"

      - name: Upload PHP lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-lint-${{ matrix.database }}
          path: ${{ runner.temp }}/php-lint-${{ matrix.database }}.txt
          if-no-files-found: error
          retention-days: 3

      - name: Validate shell scripts
        run: bash -n tests/http_smoke.sh

      - name: Run whole-application security audit
        run: |
          set -o pipefail
          php tests/application_static_audit.php 2>&1 | tee "$RUNNER_TEMP/application-static-audit-${{ matrix.database }}.txt"

      - name: Upload static audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-static-audit-${{ matrix.database }}
          path: ${{ runner.temp }}/application-static-audit-${{ matrix.database }}.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Run Phase 5 security audit
        run: php tests/phase5_static_audit.php

      - name: Run recipe workflow audit
        run: php tests/recipe_workflow_static_audit.php

      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Import clean database migrations
        run: |
          set -euo pipefail
          for file in \
            database/schema.sql \
            database/phase2_install.sql \
            database/phase3_install.sql \
            database/phase4_install.sql \
            database/phase4_hardening.sql \
            database/phase5_install.sql \
            database/phase5_shopping_extension.sql \
            database/phase5_hardening.sql
          do
            echo "Importing ${file}"
            mysql --host=127.0.0.1 --port=3306 --user=root homestead < "${file}"
          done

      - name: Replay incremental migrations
        run: |
          set -euo pipefail
          for file in \
            database/phase2_install.sql \
            database/phase3_install.sql \
            database/phase4_install.sql \
            database/phase4_hardening.sql \
            database/phase5_install.sql \
            database/phase5_shopping_extension.sql \
            database/phase5_hardening.sql
          do
            echo "Replaying ${file}"
            mysql --host=127.0.0.1 --port=3306 --user=root homestead < "${file}"
          done

      - name: Run clean-database migration audit
        run: php tests/database_integration_audit.php

      - name: Bootstrap secure test owner
        run: php bin/create-owner.php

      - name: Verify owner bootstrap is idempotent
        run: php bin/create-owner.php

      - name: Run database-backed workflow integration suite
        run: php tests/workflow_integration.php

      - name: Run prepared-food lifecycle integration suite
        run: php tests/prepared_food_integration.php

      - name: Run immutable Starter Kit recipe snapshot suite
        run: php tests/starter_kit_snapshot_integration.php

      - name: Run Starter Kit lifecycle integration suite
        run: php tests/starter_kit_lifecycle_integration.php

      - name: Create CI application configuration
        run: |
          cat > config.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'app' => [
                  'name' => 'Homestead',
                  'environment' => 'development',
                  'debug' => false,
                  'base_url' => 'http://127.0.0.1:8080',
                  'timezone' => 'America/Phoenix',
              ],
              'database' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'homestead',
                  'user' => 'root',
                  'password' => 'root',
                  'charset' => 'utf8mb4',
              ],
              'security' => [
                  'session_name' => 'homestead_ci_session',
                  'health_key' => 'ci-health-key-2026',
              ],
              'features' => [
                  'simulated_sensors' => true,
                  'device_adapters' => false,
                  'family_tracking' => true,
                  'prepared_food_tracking' => true,
              ],
          ];
          PHP

      - name: Start PHP application server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/homestead-server.log 2>&1 &
          echo $! > /tmp/homestead-server.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/login.php >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/homestead-server.log
          exit 1

      - name: Run authenticated HTTP smoke suite
        run: bash tests/http_smoke.sh

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/homestead-server.log || true
