name: Homestead Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application-validation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homestead
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_PWD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: homestead
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run whole-application security audit
        run: php tests/application_static_audit.php

      - name: Run Phase 5 security audit
        run: php tests/phase5_static_audit.php

      - name: Run recipe workflow audit
        run: php tests/recipe_workflow_static_audit.php

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Import base schema
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/schema.sql

      - name: Import Phase 2 migration
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase2_install.sql

      - name: Import Phase 3 migration
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase3_install.sql

      - name: Import Phase 4 migration
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase4_install.sql

      - name: Import Phase 4 hardening
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase4_hardening.sql

      - name: Import Phase 5 migration
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase5_install.sql

      - name: Import Phase 5 shopping extension
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase5_shopping_extension.sql

      - name: Import Phase 5 hardening
        run: mysql --host=127.0.0.1 --port=3306 --user=root homestead < database/phase5_hardening.sql

      - name: Run database-backed migration audit
        run: php tests/database_integration_audit.php
