name: Homestead Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: homestead-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: php-compatibility (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate every shell script
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find tests -type f -name '*.sh' -print0)

      - name: Run complete static audit suite
        run: |
          set -euo pipefail
          php tests/application_static_audit.php
          php tests/phase5_static_audit.php
          php tests/recipe_workflow_static_audit.php
          php tests/phase6_static_audit.php
          php tests/phase7_static_audit.php
          php tests/phase8_static_audit.php
          php tests/whole_codebase_audit.php | tee "$RUNNER_TEMP/whole-codebase-audit-php-${{ matrix.php }}.txt"

      - name: Upload whole-codebase audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-codebase-audit-php-${{ matrix.php }}
          path: ${{ runner.temp }}/whole-codebase-audit-php-${{ matrix.php }}.txt
          if-no-files-found: warn
          retention-days: 7

  application-validation:
    name: application-validation (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql-8
            image: mysql:8.0
          - database: mariadb-10.11
            image: mariadb:10.11
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homestead
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_PWD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: homestead
      DB_USER: root
      DB_PASSWORD: root
      HOMESTEAD_OWNER_EMAIL: owner@example.test
      HOMESTEAD_OWNER_PASSWORD: CI-Only-Owner-Password-2026!
      HOMESTEAD_OWNER_NAME: CI Owner
      HOMESTEAD_HOUSEHOLD_NAME: CI Homestead
      HOMESTEAD_HOUSEHOLD_SLUG: ci-homestead
      HOMESTEAD_HOUSEHOLD_TIMEZONE: America/Phoenix
      HOMESTEAD_PLATFORM_ADMIN: '1'
      HOMESTEAD_HEALTH_KEY: ci-health-key-2026-very-long-random-test-value
      HOMESTEAD_BASE_URL: http://127.0.0.1:8080
      BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Import clean database migrations
        run: |
          set -euo pipefail
          migrations=(
            database/schema.sql
            database/phase2_install.sql
            database/phase3_install.sql
            database/household_owner_integrity_hardening.sql
            database/phase4_install.sql
            database/phase4_hardening.sql
            database/phase5_install.sql
            database/phase5_shopping_extension.sql
            database/phase5_hardening.sql
            database/phase5_snapshot_storage_hardening.sql
            database/phase6_grow_harvest_preserve.sql
            database/phase7_planning_tasks_automation.sql
            database/phase8_forecasting_seasonal_self_sufficiency.sql
          )
          for file in "${migrations[@]}"; do
            echo "Importing ${file}"
            mysql --host=127.0.0.1 --port=3306 --user=root homestead < "${file}"
          done

      - name: Replay incremental migrations
        run: |
          set -euo pipefail
          migrations=(
            database/phase2_install.sql
            database/phase3_install.sql
            database/household_owner_integrity_hardening.sql
            database/phase4_install.sql
            database/phase4_hardening.sql
            database/phase5_install.sql
            database/phase5_shopping_extension.sql
            database/phase5_hardening.sql
            database/phase5_snapshot_storage_hardening.sql
            database/phase6_grow_harvest_preserve.sql
            database/phase7_planning_tasks_automation.sql
            database/phase8_forecasting_seasonal_self_sufficiency.sql
          )
          for file in "${migrations[@]}"; do
            echo "Replaying ${file}"
            mysql --host=127.0.0.1 --port=3306 --user=root homestead < "${file}"
          done

      - name: Run clean-database migration audit
        run: php tests/database_integration_audit.php

      - name: Bootstrap secure test owner
        run: |
          php bin/create-owner.php
          php bin/create-owner.php

      - name: Run complete database integration suite
        run: |
          set -euo pipefail
          php tests/auth_login_integration.php
          php tests/owner_integrity_integration.php
          php tests/workflow_integration.php
          php tests/prepared_food_integration.php
          php tests/starter_kit_snapshot_integration.php
          php tests/starter_kit_lifecycle_integration.php
          php tests/starter_kit_activation_admin_integration.php
          php tests/phase6_integration.php
          php tests/phase7_integration.php
          php tests/phase8_integration.php

      - name: Create CI application configuration
        run: |
          cat > config.php <<'PHP'
          <?php
          declare(strict_types=1);
          return [
              'app' => [
                  'name' => 'Homestead',
                  'environment' => 'development',
                  'debug' => false,
                  'base_url' => 'http://127.0.0.1:8080',
                  'timezone' => 'America/Phoenix',
              ],
              'database' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'homestead',
                  'user' => 'root',
                  'password' => 'root',
                  'charset' => 'utf8mb4',
              ],
              'security' => [
                  'session_name' => 'homestead_ci_session',
                  'health_key' => 'ci-health-key-2026-very-long-random-test-value',
              ],
              'features' => [
                  'simulated_sensors' => true,
                  'device_adapters' => false,
                  'family_tracking' => true,
                  'prepared_food_tracking' => true,
              ],
          ];
          PHP

      - name: Start PHP application server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/homestead-server.log 2>&1 &
          echo $! > /tmp/homestead-server.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/login.php >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/homestead-server.log
          exit 1

      - name: Run core authenticated HTTP smoke suite
        run: bash tests/http_smoke.sh

      - name: Run Phase 6 authenticated HTTP smoke suite
        run: bash tests/phase6_http_smoke.sh

      - name: Run Phase 7 authenticated HTTP smoke suite
        run: bash tests/phase7_http_smoke.sh

      - name: Run Phase 8 authenticated HTTP smoke suite
        run: bash tests/phase8_http_smoke.sh

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/homestead-server.log || true
