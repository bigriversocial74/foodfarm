<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1f4b36">
  <title>Homestead is offline</title>
  <link rel="icon" href="/assets/icons/homestead-icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light;--forest:#1f4b36;--ink:#17251d;--muted:#6c786f;--surface:#fffdf8;--line:rgba(31,75,54,.16)}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 0%,#dfe9d9,transparent 32rem),linear-gradient(180deg,#f8f6ef,#ece9df);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(620px,100%);padding:clamp(28px,7vw,54px);border:1px solid var(--line);border-radius:30px;background:rgba(255,253,248,.96);box-shadow:0 28px 80px rgba(32,48,39,.14);text-align:center}
    img{width:88px;height:88px;margin:0 auto 24px}
    p{color:var(--muted);line-height:1.65}
    h1{margin:0 0 14px;color:var(--forest);font:700 clamp(34px,8vw,54px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.03em}
    nav{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:26px}
    a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:10px 17px;border:1px solid var(--line);border-radius:13px;color:var(--forest);background:#fff;text-decoration:none;font-size:13px;font-weight:800}
    a:first-child{color:#fff;background:var(--forest);border-color:var(--forest)}
    a:focus-visible{outline:3px solid rgba(35,107,75,.34);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/homestead-icon.svg" alt="">
    <h1>Homestead is offline.</h1>
    <p>Your household pages and records are intentionally not stored for offline viewing. Reconnect to continue securely.</p>
    <nav aria-label="Offline actions">
      <a href="/dashboard.php">Try again</a>
      <a href="/">Open home page</a>
    </nav>
  </main>
</body>
</html>
